# Unified packaging for VOICE — builds BOTH .deb and .rpm from one config.
#   nfpm pkg -f packaging/nfpm.yaml --packager deb --target build/pkgs/
#   nfpm pkg -f packaging/nfpm.yaml --packager rpm --target build/pkgs/
# (use build_packages.sh, which does both + sanity checks)
#
# Paths are relative to the project root (run nfpm from there). The large speech
# models are NOT packaged — they download on first launch. The bundled whisper.cpp
# binary must be built on the OLDEST target glibc (Ubuntu/Mint) so it runs on
# Fedora too; nfpm just packs whatever is in whisper.cpp/build.
name: voice
arch: amd64
platform: linux
version: ${VOICE_VERSION}
release: "1"
section: utils
priority: optional
maintainer: Theologos Kalotrapezis <kalotrapezis@gmail.com>
vendor: Theologos Kalotrapezis
homepage: https://github.com/kalotrapezis/Voice
license: GPL-3.0-or-later
description: |
  Greek voice keyboard & read-aloud (offline STT/TTS).
  VOICE is a fully local, offline Greek voice toolkit: dictation (whisper.cpp)
  that types into any app, read-aloud (Piper), meeting transcription, a built-in
  clipboard manager, a voice-remote target picker, a system-tray icon and global
  shortcuts. Runs on KDE Plasma (Wayland) and on X11 desktops such as Cinnamon
  (Linux Mint); the backend is chosen at runtime. The ~0.6 GB speech models are
  downloaded once, on first launch, into ~/.local/share/voice/.

# Debian/Ubuntu/Mint/Kubuntu dependency names (the default set)
depends:
  - python3
  - python3-tk
  - python3-gi
  - gir1.2-ayatanaappindicator3-0.1
  - pipewire-bin
  - pulseaudio-utils
  - poppler-utils
  - xdotool
  - xclip
  - wmctrl
recommends:
  - ydotool
  - wl-clipboard
  - libreoffice

# Fedora dependency names differ — override for the rpm packager
overrides:
  rpm:
    depends:
      - python3
      - python3-tkinter
      - python3-gobject
      - libappindicator-gtk3
      - pipewire-utils
      - pulseaudio-utils
      - poppler-utils
      - glib2
      - ydotool
      - wl-clipboard
    recommends:
      - xdotool
      - xclip
      - wmctrl

scripts:
  postinstall: packaging/nfpm-postinstall.sh
  postremove: packaging/nfpm-postremove.sh

contents:
  # python app + modules
  - src: voice_keyboard.py
    dst: /usr/lib/voice/voice_keyboard.py
  - src: read_aloud.py
    dst: /usr/lib/voice/read_aloud.py
  - src: platform_io.py
    dst: /usr/lib/voice/platform_io.py
  - src: clipboard.py
    dst: /usr/lib/voice/clipboard.py
  - src: predict.py
    dst: /usr/lib/voice/predict.py
  - src: llm.py
    dst: /usr/lib/voice/llm.py
  - src: chatmem.py
    dst: /usr/lib/voice/chatmem.py
  - src: data/el_freq.txt
    dst: /usr/lib/voice/data/el_freq.txt

  # runtime icon used by the app + the bundled Piper engine
  - src: Assets/VoiceIcon.png
    dst: /usr/lib/voice/Assets/VoiceIcon.png
  - src: piper_tts
    dst: /usr/lib/voice/piper_tts
    type: tree

  # whisper-cli + its private shared libs (loaded via LD_LIBRARY_PATH in launcher)
  - src: whisper.cpp/build/bin/whisper-cli
    dst: /usr/lib/voice/whisper.cpp/build/bin/whisper-cli
    file_info:
      mode: 0755
  - src: whisper.cpp/build/src/libwhisper.so*
    dst: /usr/lib/voice/whisper.cpp/build/src/
  - src: whisper.cpp/build/ggml/src/libggml*.so*
    dst: /usr/lib/voice/whisper.cpp/build/ggml/src/

  # launcher, desktop entry, themed icon
  - src: packaging/voice.launcher
    dst: /usr/bin/voice
    file_info:
      mode: 0755
  - src: packaging/voice.desktop
    dst: /usr/share/applications/voice.desktop
  - src: Assets/VoiceIcon.png
    dst: /usr/share/icons/hicolor/256x256/apps/voice.png

  # license (Debian and Fedora expect it in different places)
  - src: LICENSE
    dst: /usr/share/doc/voice/copyright
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/voice/LICENSE
    packager: rpm
